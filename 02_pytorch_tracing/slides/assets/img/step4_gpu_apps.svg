<svg width="100%" viewBox="0 0 900 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Same workloads on GPU (XPU)</title>
<desc>The same Hogwild and intra-op workloads, now with DEVICE=xpu and an optional SYNC toggle, showing the autograd engine moving to its own thread.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="anthropic-sans, -apple-system, 'system-ui', 'Segoe UI', sans-serif">
<text x="450" y="28" text-anchor="middle" fill="rgb(68,68,65)" font-size="15" font-weight="600" >Same two workloads, DEVICE=xpu</text>
<rect x="60" y="60" width="340" height="44" rx="8" fill="rgb(230,241,251)" stroke="rgb(24,95,165)" stroke-width="1"/>
<text x="230.0" y="72.0" text-anchor="middle" dominant-baseline="central" fill="rgb(12,68,124)" font-size="14" font-weight="500">main thread (Python)</text>
<text x="230.0" y="92.0" text-anchor="middle" dominant-baseline="central" fill="rgb(24,95,165)" font-size="11.5">forward ops, dispatch only</text>
<line x1="230" y1="104" x2="230" y2="145" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="145" width="340" height="44" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="230.0" y="157.0" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500">autograd engine thread</text>
<text x="230.0" y="177.0" text-anchor="middle" dominant-baseline="central" fill="rgb(83,74,183)" font-size="11.5">entire backward graph runs here</text>
<line x1="400" y1="167" x2="470" y2="167" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470" y="145" width="200" height="44" rx="8" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="1"/>
<text x="570.0" y="157.0" text-anchor="middle" dominant-baseline="central" fill="rgb(8,80,65)" font-size="14" font-weight="500">XPU device</text>
<text x="570.0" y="177.0" text-anchor="middle" dominant-baseline="central" fill="rgb(15,110,86)" font-size="11.5">kernels run async</text>
<text x="230" y="210" text-anchor="middle" fill="rgb(95,94,90)" font-size="11.5" font-weight="400" >SYNC=0 default / SYNC=1 adds torch.xpu.synchronize()</text>
<text x="230" y="227" text-anchor="middle" fill="rgb(95,94,90)" font-size="11.5" font-weight="400" >synchronize() is not a dispatched op - invisible to the hook</text>
<rect x="45" y="45" width="640" height="200" rx="10" fill="none" stroke="rgb(137,135,129)" stroke-width="1" stroke-dasharray="5,4"/>
<text x="450" y="280" text-anchor="middle" fill="rgb(68,68,65)" font-size="13" font-weight="500" >Hogwild on XPU adds a 6th thread the CPU run never had</text>
<rect x="60" y="305" width="150" height="42" rx="8" fill="rgb(230,241,251)" stroke="rgb(24,95,165)" stroke-width="1"/>
<text x="135.0" y="316.0" text-anchor="middle" dominant-baseline="central" fill="rgb(12,68,124)" font-size="14" font-weight="500">main</text>
<text x="135.0" y="336.0" text-anchor="middle" dominant-baseline="central" fill="rgb(24,95,165)" font-size="11.5">spawn+warmup</text>
<rect x="230" y="305" width="150" height="42" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="305.0" y="316.0" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500">autograd engine</text>
<text x="305.0" y="336.0" text-anchor="middle" dominant-baseline="central" fill="rgb(83,74,183)" font-size="11.5">all backward work</text>
<rect x="400" y="305" width="100" height="42" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="450.0" y="326.0" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,65)" font-size="14" font-weight="500">worker 1</text>
<rect x="510" y="305" width="100" height="42" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="560.0" y="326.0" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,65)" font-size="14" font-weight="500">worker 2</text>
<rect x="620" y="305" width="100" height="42" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="670.0" y="326.0" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,65)" font-size="14" font-weight="500">worker 3</text>
<rect x="730" y="305" width="100" height="42" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="780.0" y="326.0" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,65)" font-size="14" font-weight="500">worker 4</text>
<rect x="45" y="295" width="785" height="62" rx="10" fill="none" stroke="rgb(137,135,129)" stroke-width="1" stroke-dasharray="5,4"/>
</g></svg>