<svg width="100%" viewBox="0 0 900 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DDP across MPI ranks (GPU, xccl)</title>
<desc>Four MPI ranks, each bound to its own XPU tile, gradients synchronized with the native xccl backend.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="anthropic-sans, -apple-system, 'system-ui', 'Segoe UI', sans-serif">
<text x="450" y="28" text-anchor="middle" fill="rgb(68,68,65)" font-size="15" font-weight="600" >train_ddp.py - mpiexec -n 4, backend=xccl, one tile per rank</text>
<rect x="40" y="55" width="190" height="210" rx="10" fill="none" stroke="rgb(180,178,170)" stroke-width="1" stroke-dasharray="5,4"/>
<text x="135" y="75" text-anchor="middle" fill="rgb(68,68,65)" font-size="13" font-weight="600" >rank 0 -> xpu:0</text>
<rect x="55" y="90" width="160" height="40" rx="8" fill="rgb(230,241,251)" stroke="rgb(24,95,165)" stroke-width="1"/>
<text x="135.0" y="100.0" text-anchor="middle" dominant-baseline="central" fill="rgb(12,68,124)" font-size="14" font-weight="500">main thread</text>
<text x="135.0" y="120.0" text-anchor="middle" dominant-baseline="central" fill="rgb(24,95,165)" font-size="11.5">forward, no bwd</text>
<rect x="55" y="138" width="160" height="40" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="135.0" y="148.0" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500">autograd engine</text>
<text x="135.0" y="168.0" text-anchor="middle" dominant-baseline="central" fill="rgb(83,74,183)" font-size="11.5">entire bwd graph</text>
<rect x="55" y="186" width="160" height="40" rx="8" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="1"/>
<text x="135.0" y="196.0" text-anchor="middle" dominant-baseline="central" fill="rgb(8,80,65)" font-size="14" font-weight="500">xpu:0</text>
<text x="135.0" y="216.0" text-anchor="middle" dominant-baseline="central" fill="rgb(15,110,86)" font-size="11.5">kernels run async</text>
