<text x="450" y="300" text-anchor="middle" fill="rgb(68,68,65)" font-size="13" font-weight="500" >c10d::allreduce_ (xccl) across tiles</text>
<line x1="135" y1="265" x2="450" y2="320" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="345" y1="265" x2="450" y2="320" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="555" y1="265" x2="450" y2="320" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="765" y1="265" x2="450" y2="320" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360" y="320" width="180" height="44" rx="8" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="1"/>
<text x="450.0" y="332.0" text-anchor="middle" dominant-baseline="central" fill="rgb(8,80,65)" font-size="14" font-weight="500">gradient allreduce</text>
<text x="450.0" y="352.0" text-anchor="middle" dominant-baseline="central" fill="rgb(15,110,86)" font-size="11.5">native XPU collectives</text>
<text x="450" y="385" text-anchor="middle" fill="rgb(95,94,90)" font-size="12" font-weight="400" >CPU tie breaks per-rank: backward moves onto its own engine thread</text>
