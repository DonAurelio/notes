<text x="135.0" y="161.0" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500">reducer worker</text>
<text x="135.0" y="181.0" text-anchor="middle" dominant-baseline="central" fill="rgb(83,74,183)" font-size="11.5">gloo helper thread</text>
