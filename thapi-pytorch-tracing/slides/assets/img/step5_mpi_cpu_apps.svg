<svg width="100%" viewBox="0 0 900 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DDP across MPI ranks (CPU, gloo)</title>
<desc>Four MPI ranks, each running one DDP model replica on CPU, gradients averaged by allreduce.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="anthropic-sans, -apple-system, 'system-ui', 'Segoe UI', sans-serif">
<text x="450" y="28" text-anchor="middle" fill="rgb(68,68,65)" font-size="15" font-weight="600" >train_ddp.py - mpiexec -n 4, backend=gloo</text>
<rect x="40" y="55" width="190" height="190" rx="10" fill="none" stroke="rgb(180,178,170)" stroke-width="1" stroke-dasharray="5,4"/>
<text x="135" y="75" text-anchor="middle" fill="rgb(68,68,65)" font-size="13" font-weight="600" >rank 0  (vpid)</text>
<rect x="55" y="90" width="160" height="42" rx="8" fill="rgb(230,241,251)" stroke="rgb(24,95,165)" stroke-width="1"/>
<text x="135.0" y="101.0" text-anchor="middle" dominant-baseline="central" fill="rgb(12,68,124)" font-size="14" font-weight="500">main thread</text>
<text x="135.0" y="121.0" text-anchor="middle" dominant-baseline="central" fill="rgb(24,95,165)" font-size="11.5">fwd -> bwd -> step</text>
