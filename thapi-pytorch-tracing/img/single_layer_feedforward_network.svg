<text x="108.5" y="535" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">x₁₀</text>
<circle cx="480.8" cy="530" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="480.8" y="535" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">z₅</text>
<text x="480.8" y="500" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">z₅ = Σᵢ₌₁¹⁰ w₅,ᵢxᵢ + b₅</text>
<circle cx="744.3" cy="530" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="744.3" y="535" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">a₅</text>
<text x="744.3" y="500" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">a₅ = max(0, z₅)</text>
<circle cx="992.1" cy="530" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
