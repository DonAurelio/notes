<text x="279.6" y="330.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3a5f8a">w₁,₅</text>
<line x1="506.8" y1="130" x2="720.3" y2="130" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow)"/>
