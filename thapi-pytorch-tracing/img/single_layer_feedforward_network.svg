<line x1="506.8" y1="530" x2="720.3" y2="530" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="770.3" y1="530" x2="968.1" y2="530" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="108.5" cy="130" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="108.5" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">x₁</text>
<circle cx="480.8" cy="130" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="480.8" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">z₁</text>
<text x="480.8" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">z₁ = Σᵢ₌₁¹⁰ w₁,ᵢxᵢ + b₁</text>
<circle cx="744.3" cy="130" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="744.3" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">a₁</text>
<text x="744.3" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">a₁ = max(0, z₁)</text>
<circle cx="992.1" cy="130" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="992.1" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">ŷ₁</text>
<text x="992.1" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">ŷ₁ = a₁</text>
<circle cx="108.5" cy="230" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="108.5" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">x₂</text>
<circle cx="480.8" cy="230" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="480.8" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">z₂</text>
<text x="480.8" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">z₂ = Σᵢ₌₁¹⁰ w₂,ᵢxᵢ + b₂</text>
<circle cx="744.3" cy="230" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="744.3" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">a₂</text>
<text x="744.3" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">a₂ = max(0, z₂)</text>
<circle cx="992.1" cy="230" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="992.1" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">ŷ₂</text>
<text x="992.1" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">ŷ₂ = a₂</text>
<circle cx="108.5" cy="330" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="108.5" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">x₃</text>
<circle cx="480.8" cy="330" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="480.8" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">z₃</text>
<text x="480.8" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">z₃ = Σᵢ₌₁¹⁰ w₃,ᵢxᵢ + b₃</text>
<circle cx="744.3" cy="330" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="744.3" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">a₃</text>
<text x="744.3" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">a₃ = max(0, z₃)</text>
<circle cx="992.1" cy="330" r="20" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="992.1" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">ŷ₃</text>
<text x="992.1" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222222">ŷ₃ = a₃</text>
