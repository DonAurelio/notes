<text x="480.8" y="585" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f3a5f">Biases</text>
<text x="480.8" y="605" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#222222">b₁, b₂, b₃, b₄, b₅</text>
