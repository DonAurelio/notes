<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 640" role="img" aria-label="Single-layer feedforward network: 10 inputs feed a Linear(10,5) layer computing z=Wx+b, then a ReLU activation a=max(0,z) produces the 5 outputs.">
<rect x="0" y="0" width="1110" height="640" fill="#ffffff"/>
<rect x="20.0" y="55" width="177.0" height="500" fill="#f4f6f8"/>
<text x="108.5" y="30" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f3a5f">Input layer</text>
<text x="108.5" y="49" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f3a5f">(10 features)</text>
<rect x="367.0" y="55" width="227.4" height="500" fill="#f4f6f8"/>
<text x="480.8" y="30" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f3a5f">Linear layer</text>
<text x="480.8" y="49" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f3a5f">(10 → 5): z = Wx + b</text>
<rect x="634.5" y="55" width="219.6" height="500" fill="#f4f6f8"/>
<text x="744.3" y="30" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f3a5f">ReLU activation</text>
<text x="744.3" y="49" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f3a5f">a = max(0, z)</text>
<rect x="894.1" y="55" width="196.1" height="500" fill="#f4f6f8"/>
<text x="992.1" y="30" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f3a5f">Output layer</text>
<text x="992.1" y="49" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f3a5f">(5 outputs): ŷ = a</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
