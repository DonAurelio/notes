<svg width="100%" viewBox="0 0 900 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Inter-op vs intra-op concurrency</title>
<desc>Two CPU concurrency axes: Hogwild with four worker threads sharing one model, versus a single thread using ATen's internal thread pool.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="anthropic-sans, -apple-system, 'system-ui', 'Segoe UI', sans-serif">
<text x="210" y="30" text-anchor="middle" fill="rgb(68,68,65)" font-size="15" font-weight="600" >train_hogwild.py - inter-op</text>
<rect x="60" y="55" width="300" height="46" rx="8" fill="rgb(230,241,251)" stroke="rgb(24,95,165)" stroke-width="1"/>
<text x="210.0" y="68.0" text-anchor="middle" dominant-baseline="central" fill="rgb(12,68,124)" font-size="14" font-weight="500">main thread</text>
<text x="210.0" y="88.0" text-anchor="middle" dominant-baseline="central" fill="rgb(24,95,165)" font-size="11.5">spawns 4 workers</text>
<rect x="60" y="130" width="300" height="42" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="210.0" y="141.0" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500">worker 1</text>
<text x="210.0" y="161.0" text-anchor="middle" dominant-baseline="central" fill="rgb(83,74,183)" font-size="11.5">fwd -> loss -> bwd -> step</text>
<line x1="210" y1="101" x2="210" y2="130" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="180" width="300" height="42" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="210.0" y="191.0" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500">worker 2</text>
<text x="210.0" y="211.0" text-anchor="middle" dominant-baseline="central" fill="rgb(83,74,183)" font-size="11.5">fwd -> loss -> bwd -> step</text>
<line x1="210" y1="101" x2="210" y2="180" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="230" width="300" height="42" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="210.0" y="241.0" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500">worker 3</text>
<text x="210.0" y="261.0" text-anchor="middle" dominant-baseline="central" fill="rgb(83,74,183)" font-size="11.5">fwd -> loss -> bwd -> step</text>
<line x1="210" y1="101" x2="210" y2="230" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="280" width="300" height="42" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"/>
<text x="210.0" y="291.0" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500">worker 4</text>
<text x="210.0" y="311.0" text-anchor="middle" dominant-baseline="central" fill="rgb(83,74,183)" font-size="11.5">fwd -> loss -> bwd -> step</text>
<line x1="210" y1="101" x2="210" y2="280" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45" y="45" width="330" height="285" rx="10" fill="none" stroke="rgb(137,135,129)" stroke-width="1" stroke-dasharray="5,4"/>
<text x="210" y="350" text-anchor="middle" fill="rgb(95,94,90)" font-size="12" font-weight="400" >N OS threads, 1 process</text>
<text x="210" y="368" text-anchor="middle" fill="rgb(95,94,90)" font-size="12" font-weight="400" >RecordFunction sees one vtid per thread</text>
<text x="690" y="30" text-anchor="middle" fill="rgb(68,68,65)" font-size="15" font-weight="600" >train_intraop.py - intra-op</text>
<rect x="540" y="90" width="300" height="46" rx="8" fill="rgb(230,241,251)" stroke="rgb(24,95,165)" stroke-width="1"/>
<text x="690.0" y="103.0" text-anchor="middle" dominant-baseline="central" fill="rgb(12,68,124)" font-size="14" font-weight="500">main thread (Python)</text>
<text x="690.0" y="123.0" text-anchor="middle" dominant-baseline="central" fill="rgb(24,95,165)" font-size="11.5">set_num_threads(N)</text>
<line x1="690" y1="136" x2="690" y2="175" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540" y="175" width="300" height="46" rx="8" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="1"/>
<text x="690.0" y="188.0" text-anchor="middle" dominant-baseline="central" fill="rgb(8,80,65)" font-size="14" font-weight="500">aten::linear  (one dispatch)</text>
<text x="690.0" y="208.0" text-anchor="middle" dominant-baseline="central" fill="rgb(15,110,86)" font-size="11.5">single RecordFunction event</text>
<line x1="690" y1="221" x2="690" y2="260" stroke="rgb(137,135,129)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="560" y="260" width="60" height="40" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="590.0" y="280.0" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,65)" font-size="14" font-weight="500">core 0</text>
<rect x="630" y="260" width="60" height="40" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="660.0" y="280.0" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,65)" font-size="14" font-weight="500">core 1</text>
<rect x="700" y="260" width="60" height="40" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="730.0" y="280.0" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,65)" font-size="14" font-weight="500">core 2</text>
<rect x="770" y="260" width="60" height="40" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="1"/>
<text x="800.0" y="280.0" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,65)" font-size="14" font-weight="500">core N</text>
<line x1="690" y1="221" x2="590" y2="260" stroke="rgb(137,135,129)" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="690" y1="221" x2="660" y2="260" stroke="rgb(137,135,129)" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="690" y1="221" x2="730" y2="260" stroke="rgb(137,135,129)" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="690" y1="221" x2="800" y2="260" stroke="rgb(137,135,129)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="530" y="80" width="320" height="240" rx="10" fill="none" stroke="rgb(137,135,129)" stroke-width="1" stroke-dasharray="5,4"/>
<text x="690" y="350" text-anchor="middle" fill="rgb(95,94,90)" font-size="12" font-weight="400" >1 thread launches, ATen parallel_for</text>
<text x="690" y="368" text-anchor="middle" fill="rgb(95,94,90)" font-size="12" font-weight="400" >fans work across cores below the hook</text>
<line x1="450" y1="45" x2="450" y2="400" stroke="rgb(200,198,190)" stroke-width="1" stroke-dasharray="4,3"/>
</g></svg>